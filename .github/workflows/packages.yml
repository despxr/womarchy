# Build without signing secrets; only main may publish through the womarchy-repo environment.
name: packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to rebuild (space-separated); empty only re-signs the repository
        required: false
        default: 'mesa-womarchy womarchy-keyring'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: packages
  cancel-in-progress: false

env:
  SNAPSHOT_MIRROR: https://stable-mirror.omarchy.org/$repo/os/$arch
  SIGNING_KEY_FPR: E0294A6FFD4CC7FF61F86F0BB0EE0B3F4029644C
  RELEASE: packages

jobs:
  build:
    if: inputs.packages != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 300
    steps:
      - name: Use Omarchy's package snapshot
        run: |
          echo "Server = $SNAPSHOT_MIRROR" > /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syyuu --noconfirm git sudo

      - uses: actions/checkout@v7

      - name: Build and verify linked libraries
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          read -r -a pkgs <<<"$PACKAGES"
          sudo -u builder env WOMARCHY_REPO="$GITHUB_WORKSPACE/out/repo" \
            bash linux/packages/build-all.sh "${pkgs[@]}"
          if [[ " ${pkgs[*]} " == *" mesa-womarchy "* ]]; then
            bash tools/check-mesa-llvm.sh out/repo
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/repo/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    container: archlinux:base
    environment: womarchy-repo
    permissions:
      contents: write
    steps:
      - name: Tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm github-cli gnupg curl libarchive

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: needs.build.result == 'success'
        with:
          name: packages
          path: new

      - name: Fetch and verify the existing signed repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A new fork has no release. Seed from the current signed upstream repository,
          # not its frozen unsigned legacy release. Fail closed on network/auth errors.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > releases.txt
          if grep -qxF "$RELEASE" releases.txt; then
            url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$RELEASE"
          else
            url=https://github.com/sytelus/womarchy/releases/download/packages
          fi
          mkdir repo
          WOMARCHY_REPO_URL="$url" bash linux/packages/fetch-signed-db.sh --fetch-packages repo

      - name: Sign, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNING_KEY: ${{ secrets.WOMARCHY_REPO_SIGNING_KEY }}
        run: bash tools/publish-packages.sh
